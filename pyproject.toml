[project]
name = "capstone"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "krishnalad17", email = "krishna.18152@sakec.ac.in" }
]
requires-python = ">=3.13"
dependencies = [
    "asyncpg>=0.32.0",
    "beautifulsoup4>=4.15.0",
    "fastapi-cloud-cli>=0.27.1",
    "fastapi[standard]>=0.162.0",
    "huggingface-hub>=2.4.0",
    "langchain>=1.4.9",
    "langchain-anthropic>=1.7.10",
    "langchain-openai>=1.8.0",
    "langchain-postgres>=0.0.19",
    "langchain-text-splitters>=1.1.3",
    "lxml>=6.1.3",
    "numpy>=2.5.4",
    "onnxruntime>=1.32.0",
    "openpyxl>=3.1.5",
    "pandas>=3.1.1",
    "psycopg[binary]>=3.3.8",
    "pydantic>=2.14.3",
    "pydantic-ai-harness[repair-tool-arguments,skills]==0.68.0",
    "pydantic-ai[slim]==2.68.0",
    "pydantic-evals>=2.66.0",
    "pypdf>=7.1.0",
    "python-docx>=1.2.0",
    "python-dotenv>=1.2.4",
    "sounddevice>=0.5.6",
    "tokenizers>=0.23.3",
]

[project.scripts]
capstone = "capstone:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = [
    "services/embed",
]
exclude = ["services/tts"]

[tool.ruff.lint]
ignore = ["BLE001", "PLW1510", "DTZ002"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
