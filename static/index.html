<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Circuit</title>
  <meta name="theme-color" content="#0b0908">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" href="/icon-192.png">
  <link rel="apple-touch-icon" href="/icon-192.png">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main>
    <header>
      <p class="kicker">Tera apna assistant</p>
      <h1>CIRCUIT</h1>
    </header>

    <!-- Original illustration: red-lens aviators over a gold chain -->
    <svg class="hero" viewBox="0 0 320 170" role="img" aria-label="Red-lens sunglasses above a gold chain">
      <defs>
        <linearGradient id="lens" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#ff5468"/>
          <stop offset="1" stop-color="#8e0a1d"/>
        </linearGradient>
        <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#f6dc8b"/>
          <stop offset="1" stop-color="#b8851a"/>
        </linearGradient>
      </defs>
      <path d="M20 18 H300" stroke="url(#gold)" stroke-width="5" stroke-linecap="round"/>
      <path d="M150 62 q10 -10 20 0" fill="none" stroke="url(#gold)" stroke-width="5" stroke-linecap="round"/>
      <path d="M40 54 H12 M280 54 H308" stroke="url(#gold)" stroke-width="5" stroke-linecap="round"/>
      <path d="M40 40 H146 Q150 84 118 98 Q70 112 46 80 Q36 64 40 40 Z" fill="url(#lens)" stroke="url(#gold)" stroke-width="4"/>
      <path d="M280 40 H174 Q170 84 202 98 Q250 112 274 80 Q284 64 280 40 Z" fill="url(#lens)" stroke="url(#gold)" stroke-width="4"/>
      <path d="M58 52 q18 -4 40 0" stroke="#fff" stroke-opacity=".45" stroke-width="4" stroke-linecap="round" fill="none"/>
      <path d="M192 52 q18 -4 40 0" stroke="#fff" stroke-opacity=".45" stroke-width="4" stroke-linecap="round" fill="none"/>
      <path d="M70 118 C 90 168, 230 168, 250 118" fill="none" stroke="url(#gold)" stroke-width="9"
            stroke-linecap="round" stroke-dasharray="14 7"/>
      <path d="M92 124 C 112 160, 208 160, 228 124" fill="none" stroke="url(#gold)" stroke-width="6"
            stroke-linecap="round" stroke-dasharray="10 6" opacity=".85"/>
    </svg>

    <p id="status" class="status" data-state="idle" role="status" aria-live="polite">Dabao aur bolo</p>

    <button id="talk" class="talk" type="button" aria-label="Hold to talk">
      <span class="ring"></span>
      <span class="label">HOLD</span>
    </button>

    <p class="hint">Button dabake rakho, bolo, phir chhod do.</p>
    <p id="timing" class="timing" aria-hidden="true"></p>

    <button id="replay" class="link ghost" type="button">Jawab dobara sunao</button>
    <button id="change-key" class="link" type="button">Key badlo</button>
  </main>

  <!-- First-run key prompt. The key stays on this phone only (localStorage). -->
  <div id="key-panel" class="panel" hidden>
    <form id="key-form">
      <h2>Key daalo</h2>
      <p>Ye sirf is phone me save hota hai.</p>
      <input id="key-input" type="password" autocomplete="off" autocapitalize="off"
             spellcheck="false" placeholder="API key" required>
      <button type="submit">Save</button>
    </form>
  </div>

  <script src="/app.js"></script>
</body>
</html>
